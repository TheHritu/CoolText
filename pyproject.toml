[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pycooltext-api"
version = "0.1.3"
description = "A Python wrapper for the CoolText.com image generation API"
readme = "PYPI-README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "TheHritu"}]
dependencies = [
    "requests",
    "pydantic",
    "beautifulsoup4",
    "fake-useragent",
]

[project.urls]
Homepage = "https://github.com/TheHritu/CoolText"

[project.scripts]
cooltext = "cooltext.__main__:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
cooltext = ["logo_id.json"]